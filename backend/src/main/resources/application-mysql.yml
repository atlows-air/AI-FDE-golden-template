# 连真实 MySQL。先用 db/schema.sql 建表（需要演示数据再执行 db/data.sql），再用这个 profile 启动。
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/demo?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  sql:
    init:
      mode: never
